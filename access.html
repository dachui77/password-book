<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Book - 访问验证</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e4e6f0;
  }
  .container {
    background: #1a1d27;
    border: 1px solid #2e3348;
    border-radius: 20px;
    padding: 40px;
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .logo {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #6c8aff, #4a6cf7);
    border-radius: 16px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo svg { width: 32px; height: 32px; color: #fff; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .subtitle { color: #7a7f9c; font-size: 14px; margin-bottom: 30px; }
  .question {
    background: #222633;
    border: 1px solid #2e3348;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .question p { font-size: 14px; color: #e4e6f0; margin-bottom: 12px; }
  .question input {
    width: 100%;
    height: 44px;
    background: #1a1d27;
    border: 1px solid #2e3348;
    border-radius: 8px;
    padding: 0 16px;
    color: #e4e6f0;
    font-size: 16px;
    text-align: center;
    letter-spacing: 4px;
    outline: none;
    transition: border-color 0.15s;
  }
  .question input:focus { border-color: #6c8aff; }
  .btn {
    width: 100%;
    height: 48px;
    background: linear-gradient(135deg, #6c8aff, #4a6cf7);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.9; }
  .error {
    color: #f87171;
    font-size: 13px;
    margin-top: 12px;
    min-height: 20px;
  }
  .hint {
    margin-top: 24px;
    font-size: 12px;
    color: #7a7f9c;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h1>Password Book</h1>
  <p class="subtitle">请输入验证码进入应用</p>
  
  <div class="question">
    <p>验证问题：应用名称的第一个字母是什么？</p>
    <input type="text" id="answer" placeholder="输入答案" maxlength="1" onkeydown="if(event.key==='Enter')checkAnswer()">
  </div>
  
  <button class="btn" onclick="checkAnswer()">验证并进入</button>
  <div class="error" id="error"></div>
  
  <p class="hint">提示：答案是大写字母 "P"</p>
</div>

<script>
function checkAnswer() {
  const answer = document.getElementById('answer').value.toUpperCase().trim();
  const error = document.getElementById('error');
  
  if (answer === 'P') {
    sessionStorage.setItem('pb_access', 'granted');
    window.location.href = 'index.html';
  } else {
    error.textContent = '验证失败，请重试';
    document.getElementById('answer').value = '';
    document.getElementById('answer').focus();
  }
}

if (sessionStorage.getItem('pb_access') === 'granted') {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
